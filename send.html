<!DOCTYPE html>
<html>
<head>
  <title>Light Sender PRO</title>
  <style>
    body {
      text-align: center;
      background: black;
      color: white;
      font-family: Arial;
    }
    input, button {
      padding: 10px;
      margin: 10px;
    }
    #flash {
      width: 150px;
      height: 150px;
      margin: 20px auto;
      background: black;
      border: 2px solid white;
    }
  </style>
</head>
<body>

<h2>💡 Light Sender</h2>

<input id="text" placeholder="Enter message">
<br>
<button onclick="initTorch()">Initialize Flashlight</button>
<button onclick="send()">Send</button>

<p id="status">Click Initialize first</p>

<div id="flash"></div>

<script>
let torchTrack = null;

function textToBinary(text) {
  return text.split('').map(c =>
    c.charCodeAt(0).toString(2).padStart(8,'0')
  ).join('');
}

async function initTorch() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } }
    });

    torchTrack = stream.getVideoTracks()[0];

    const cap = torchTrack.getCapabilities();

    if (cap.torch) {
      document.getElementById("status").innerText = "✅ Torch ready";
    } else {
      document.getElementById("status").innerText = "⚠️ Torch not supported (using screen)";
    }

  } catch (e) {
    document.getElementById("status").innerText = "❌ Camera error";
  }
}

async function send() {
  let text = document.getElementById("text").value;
  let binary = "11111111" + textToBinary(text); // start signal

  for (let bit of binary) {
    await flash(bit === "1");
    await sleep(250);
  }

  await flash(false);
}

async function flash(on) {
  // Visual box
  document.getElementById("flash").style.background = on ? "white" : "black";

  // Try torch
  try {
    await torchTrack.applyConstraints({
      advanced: [{ torch: on }]
    });
  } catch (e) {
    // fallback
    document.body.style.background = on ? "white" : "black";
    document.body.style.color = on ? "black" : "white";
  }
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}
</script>

</body>
</html>
