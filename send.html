<!DOCTYPE html>
<html>
<head>
  <title>Light Sender</title>
  <style>
    body {
      text-align: center;
      background: black;
      color: white;
      font-family: Arial;
    }
    #flash {
      width: 200px;
      height: 200px;
      margin: 20px auto;
      background: black;
      border: 2px solid white;
    }
  </style>
</head>
<body>

<h2>💡 Light Sender (Flashlight)</h2>
<input id="text" placeholder="Enter message">
<button onclick="initTorch()">Initialize Flashlight</button>
<button onclick="send()">Send</button>
<p id="status">Click "Initialize Flashlight" first</p>

<div id="flash"></div>

<script>
function textToBinary(text) {
  return text.split('').map(c =>
    c.charCodeAt(0).toString(2).padStart(8,'0')
  ).join('');
}

let torchTrack = null;

async function initTorch() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', torch: true }
    });
    torchTrack = stream.getVideoTracks()[0];
    stream.getTracks().forEach(track => track.stop());
    return true;
  } catch (e) {
    console.log('Torch not available:', e);
    return false;
  }
}

async function send() {
  let text = document.getElementById("text").value;
  let binary = textToBinary(text);
  
  if (!torchTrack) {
    alert('Please initialize torch first. Click "Initialize Flashlight"');
    return;
  }

  for (let bit of binary) {
    if (bit === "1") {
      await flash(true);
    } else {
      await flash(false);
    }
    await sleep(200);
  }
  await flash(false); // Turn off after sending
}

async function flash(on) {
  try {
    const capabilities = torchTrack.getCapabilities();
    if (capabilities.torch) {
      await torchTrack.applyConstraints({
        advanced: [{ torch: on }]
      });
    }
  } catch (e) {
    console.log('Torch error:', e);
  }
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}
</script>

</body>
</html>
