<script>
function textToBinary(text) {
  return text.split('').map(c =>
    c.charCodeAt(0).toString(2).padStart(8,'0')
  ).join('');
}

let torchTrack = null;
let streamRef = null;

async function initTorch() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } }
    });

    streamRef = stream;
    torchTrack = stream.getVideoTracks()[0];

    const capabilities = torchTrack.getCapabilities();

    if (!capabilities.torch) {
      document.getElementById("status").innerText = "❌ Torch not supported on this device";
      return;
    }

    document.getElementById("status").innerText = "✅ Flashlight ready!";
  } catch (e) {
    console.log(e);
    document.getElementById("status").innerText = "❌ Camera access failed";
  }
}

async function send() {
  let text = document.getElementById("text").value;
  let binary = textToBinary(text);

  if (!torchTrack) {
    alert('Initialize flashlight first!');
    return;
  }

  for (let bit of binary) {
    await flash(bit === "1");
    await sleep(200);
  }

  await flash(false);
}

async function flash(on) {
  try {
    await torchTrack.applyConstraints({
      advanced: [{ torch: on }]
    });
  } catch (e) {
    console.log("Torch error:", e);
  }
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}
</script>
