<!DOCTYPE html>
<html>
<head>
  <title>Light Receiver PRO</title>
</head>
<body>

<h2>📷 Light Receiver</h2>
<video id="video" autoplay playsinline width="300"></video>
<p id="output">Waiting...</p>

<script>
let video = document.getElementById("video");
let output = document.getElementById("output");

navigator.mediaDevices.getUserMedia({
  video: { facingMode: "environment" }
})
.then(stream => video.srcObject = stream);

let canvas = document.createElement("canvas");
let ctx = canvas.getContext("2d");

let buffer = "";
let started = false;

setInterval(() => {
  if (!video.videoWidth) return;

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  ctx.drawImage(video, 0, 0);

  let frame = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

  let brightness = 0;
  for (let i = 0; i < frame.length; i += 4) {
    brightness += frame[i];
  }
  brightness /= (frame.length / 4);

  let bit = brightness > 100 ? "1" : "0";

  buffer += bit;

  // detect start signal
  if (!started && buffer.includes("11111111")) {
    started = true;
    buffer = "";
    output.innerText = "Receiving: ";
    return;
  }

  if (started && buffer.length >= 8) {
    let byte = buffer.slice(0, 8);
    buffer = buffer.slice(8);

    let char = String.fromCharCode(parseInt(byte, 2));
    output.innerText += char;
  }

}, 250);
</script>

</body>
</html>
